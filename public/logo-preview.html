<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壹苯图书馆 · Logo 设计过程</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; background:#f1f5f9; margin:0; padding:40px 20px; }
  h1 { text-align:center; color:#1e293b; margin-bottom:8px; }
  .sub { text-align:center; color:#64748b; margin-bottom:32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:24px; max-width:1000px; margin:0 auto; }
  .card { background:#fff; border-radius:16px; padding:28px 20px; text-align:center; box-shadow:0 4px 14px rgba(15,23,42,.07); transition:transform .15s; }
  .card:hover { transform:translateY(-4px); }
  .card img { width:150px; height:150px; display:block; margin:0 auto; }
  .card p { margin-top:16px; font-weight:700; color:#334155; }
  .card small { color:#64748b; }
</style>
</head>
<body>
<h1>壹苯图书馆 · Logo 设计过程</h1>
<p class="sub">历轮候选方案 · 已定稿 C1「书在环中」（明暗双版本适配）</p>
<div class="grid">
  <div class="card"><img src="./logo-c1.svg" alt="C1"><p>C1 · 书在环中（定稿）</p><small>双键内线缩短</small></div>
  <div class="card"><img src="./logo-c2.svg" alt="C2"><p>C2 · 徽章版</p><small>加浅色圆章底</small></div>
  <div class="card"><img src="./logo-c3.svg" alt="创意1"><p>创意1 · 苯环放大镜</p><small>苯环作镜片看书页</small></div>
  <div class="card"><img src="./logo-c4.svg" alt="创意2"><p>创意2 · 苯环书脊</p><small>苯环为脊，两页展开</small></div>
</div>
</body>
</html>
