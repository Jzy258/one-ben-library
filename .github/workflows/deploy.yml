# 构建 VitePress 站点并部署到 GitHub Pages
# 每次 push 到 main 分支时自动触发
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Vite cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vite-cache-${{ runner.os }}-

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # 项目页 URL 带仓库名前缀，如 /library/，需传给 VitePress 作为 base
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
